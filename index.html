<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EcrewUltra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>EcrewUltra</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070d18;--card:#1b2840;--card2:#223150;--line:#2e4066;--fg:#eef3fb;--mut:#93a4c0;
  --acc:#4da3ff;--fl:#2196f3;--ho:#ff9800;--off:#4caf50;--sb:#00bcd4;--dh:#b388ff;
  --mk:#f06292;--br:#ffb300;
  --st:env(safe-area-inset-top);--sb2:env(safe-area-inset-bottom);
}
html{height:100%}
html,body{margin:0;background:#0f1a2e;color:var(--fg);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{-webkit-font-smoothing:antialiased;overflow:hidden}
#shell{position:fixed;top:0;left:0;right:0;
 height:100vh;height:100svh;height:100dvh;
 display:flex;flex-direction:column}
#hdr{flex:none;background:var(--bg);border-bottom:1px solid var(--line);
 padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
#hdr .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.sig{margin-top:1px;font-size:11.5px;font-weight:700;color:#8ea4c4}
.sig .hr{color:#fff}
#scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
 background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 20px}
#hdr h1{font-size:36px;margin:0;font-weight:800;letter-spacing:-.3px;line-height:1}
#hdr h1 span{color:var(--acc)}
#hdr .sub{font-size:10.5px;color:var(--mut);margin-left:auto;text-align:right;
 line-height:1.3;background:var(--card);border:1px solid var(--line);border-radius:11px;
 padding:7px 11px;font-weight:700;display:flex;align-items:center;gap:7px}
#hdr .sub:active{background:var(--card2)}
.spin{width:13px;height:13px;border:2px solid #3b4d72;border-top-color:var(--acc);
 border-radius:50%;display:none}
.sub.busy .spin{display:block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ====== nut cap nhat: vong tien do + dau tick xanh ====== */
#stamp .ic{width:30px;height:30px;flex:none}
#stamp .pct{font-size:8.5px;font-weight:800;fill:var(--acc);
 text-anchor:middle;dominant-baseline:central}
#stamp .trk{fill:none;stroke:#3b4d72;stroke-width:2.5}
#stamp .arc{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;
 transform:rotate(-90deg);transform-origin:11px 11px;transition:stroke-dashoffset .6s ease}
#stamp .ic.ok{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
#stamp.done{border-color:#2f6b43;background:#15301f}
#stamp .ic.ok circle{fill:#22c55e;stroke:none}
#stamp .ic.ok path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
 stroke-dasharray:16;stroke-dashoffset:16;animation:drw .45s .05s ease forwards}
@keyframes drw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
#stamp .tx{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
#stamp .tx b{font-size:10.5px;font-weight:700}
#stamp .tx small{font-size:9px;font-weight:400;color:var(--mut)}

/* ====== LOCK (bug cu: .lock de len [hidden]) ====== */
.lock{min-height:88vh;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:14px;text-align:center}
.lock[hidden]{display:none!important}
.lock h2{margin:0;font-size:24px;font-weight:800}.lock h2 span{color:var(--acc)}
.lock p{color:var(--mut);font-size:14px;margin:0;max-width:300px}
.lock input{background:var(--card);border:1px solid var(--line);color:var(--fg);
 border-radius:12px;padding:14px 16px;font-size:17px;width:min(300px,86vw);text-align:center}
.lock button{background:var(--acc);color:#04203f;border:0;border-radius:12px;padding:13px 32px;font:800 16px inherit}
.err{color:#ff8e8e;font-size:13px;min-height:18px}
#app[hidden],#tabs[hidden],#detail[hidden],#hdr[hidden]{display:none!important}

/* ====== DANH SACH KIEU ECREW ====== */
.mon{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.1em;
 text-transform:uppercase;margin:16px 0 8px}
.row{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);
 border-left-width:4px;border-radius:12px;padding:9px 11px;margin-bottom:6px;width:100%;
 text-align:left;color:inherit;font:inherit;cursor:pointer}
.row.Flight{border-left-color:var(--fl)}.row.Hotel{border-left-color:var(--ho)}
.row.Off{border-left-color:var(--off)}.row.Standby{border-left-color:var(--sb)}
.row.Default{border-left-color:#64748b}
.row.today{background:#17243d;box-shadow:inset 0 0 0 1px var(--acc)}
.row .dt{min-width:42px;text-align:center;flex:none}
.row .dt .d{font-size:19px;font-weight:800;line-height:1.05}
.row .dt .w{font-size:10px;color:var(--mut);font-weight:700}
.row .mid{flex:1;min-width:0}
.row .ttl{font-weight:800;font-size:15px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.row .rt{font-size:12.5px;color:#cfe0f7;font-weight:600}
.row .tl{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:2px}
.row .tl b{color:var(--br);font-weight:700}
.row .tl i{color:var(--mk);font-style:normal;font-weight:700}
.row .rr{align-self:center;color:#445674;font-size:18px;flex:none}
.badge{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;
 background:#2d2350;color:var(--dh);border:1px solid #42337a}
.badge.cap{background:#1d3326;color:#7bd68e;border-color:#2f5c3d}


/* ====== MAN HINH MO DAU ====== */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);
 display:flex;align-items:center;justify-content:center;overflow:hidden}
#splash[hidden]{display:none!important}
#splash.out{animation:spfade .55s ease forwards}
@keyframes spfade{to{opacity:0;visibility:hidden}}
.sttl{font-size:clamp(34px,11vw,72px);font-weight:800;letter-spacing:-1.5px;
 z-index:2;animation:sttlIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.sttl span{color:var(--acc)}
.sttl.go{animation:sttlOut .5s ease forwards}
@keyframes sttlIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes sttlOut{to{opacity:0;transform:scale(1.5) translateY(-12px)}}
.pl{position:absolute;bottom:-22vh;line-height:0;color:#8ec8ff;
 opacity:0;will-change:transform,opacity;
 filter:drop-shadow(0 0 16px rgba(90,170,255,.5))}
.pl svg{display:block;width:1em;height:1em;fill:currentColor}
@keyframes fly{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  10%{opacity:1}
  85%{opacity:1}
  100%{opacity:0;transform:translateY(-150vh) scale(1.9)}
}
.pl.big{color:#cfe6ff;filter:drop-shadow(0 0 46px rgba(120,190,255,.6))}
@keyframes flybig{
  0%{opacity:0;transform:translateY(0) scale(.5)}
  25%{opacity:1}
  70%{opacity:1}
  100%{opacity:0;transform:translateY(-165vh) scale(4.2)}
}

/* ====== THE DUTY KIEU ECREW ====== */
.grp{background:var(--card);border:1px solid var(--line);border-left-width:4px;
 border-radius:14px;margin-bottom:10px;overflow:hidden}
.grp.Flight{border-left-color:var(--fl)}.grp.Off{border-left-color:var(--off)}
.grp.Standby{border-left-color:var(--sb)}.grp.Default{border-left-color:#64748b}
.grp.Training{border-left-color:#b388ff}
.grp.none{border-left-color:#3a465e;opacity:.6}
.grp.none .dayhd{padding:11px 13px}
.grp.none .nolbl{margin-left:auto;font-size:11.5px;color:#6a7a96;font-weight:700}
.grp.none{cursor:pointer}
.memo{margin:0 13px 11px;padding:9px 11px;background:#2a2113;border:1px solid #574424;
 border-radius:10px;font-size:13px;color:#ffd479;white-space:pre-wrap;line-height:1.45}
.memo b{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
 color:#c99b3f;margin-bottom:3px}
.mynote{margin:0 13px 11px;padding:9px 11px;background:#122a1c;border:1px solid #2f5c3d;
 border-radius:10px;font-size:13px;color:#9fe0b4;white-space:pre-wrap;line-height:1.45}
.mynote b{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
 color:#5fae79;margin-bottom:3px}
#note{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
#note[hidden]{display:none!important}
#note .nbody{flex:1;overflow-y:auto;max-width:760px;margin:0 auto;width:100%;
 padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px))}
#note textarea{width:100%;min-height:42vh;background:var(--card);color:var(--fg);
 border:1px solid var(--line);border-radius:14px;padding:13px;font:15px/1.6 inherit;resize:vertical}
#note .save{width:100%;margin-top:12px;background:var(--acc);color:#04203f;border:0;
 border-radius:12px;padding:13px;font:800 15px inherit}
.dayhd{display:flex;align-items:baseline;gap:8px;padding:10px 13px 2px}
.dayhd .dd{font-size:15.5px;font-weight:800;line-height:1.2;letter-spacing:-.2px}
.dayhd .ww{font-size:12.5px;color:var(--mut);font-weight:700}
.dayhd .tg{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:99px;
 background:#1c2a44;color:var(--mut);font-weight:800}
.prep{display:flex;gap:4px;margin:8px 13px 2px;padding:10px 8px;
 background:#0a1120;border:1px solid #1d2b45;border-radius:12px}
.prep div{flex:1;text-align:center}
.prep .t{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.prep .k{font-size:9.5px;color:#7d8ca8;font-weight:800;margin-top:2px;letter-spacing:.06em}
.prep .m .t{color:var(--mk)}.prep .b .t{color:var(--br)}.prep .o .t{color:var(--acc)}
.duty{padding:9px 13px 11px;cursor:pointer}
.duty+.duty{border-top:1px solid #1b2742}
.rep{font-size:13.5px;font-weight:700;color:var(--fg)}
.rep span{color:var(--mut);font-weight:600}
.lgs{margin:5px 0 4px}
.lg{display:flex;gap:7px;align-items:baseline;font-size:14.5px;
 font-variant-numeric:tabular-nums;padding:2.5px 0}
.lg .fn{color:#5ab0ff;font-weight:800;min-width:46px}
.lg .tm{color:#ff8a65;font-weight:600;min-width:44px}
.lg .ar{font-weight:800;letter-spacing:.3px}
.lg .dh{font-size:10px;color:var(--dh);font-weight:800;margin-left:auto}
.htl{margin:0;padding:10px 13px;background:#1a1507;border-top:1px solid #3a2f12;
 border-bottom:1px solid #3a2f12}
.htl .nm{color:#ffb74d;font-weight:800;font-size:13.5px}
.htl .rs{color:#c8a35a;font-size:11.5px;margin-top:2px}
.morebtn{width:100%;background:var(--card);border:1px dashed var(--line);color:var(--mut);
 border-radius:12px;padding:12px;font:700 13px inherit;margin:8px 0}
.morebtn:active{background:var(--card2)}
.morebtn{position:relative;overflow:hidden}
.morebtn.loading{border-style:solid;border-color:#2b5582;color:var(--fg)}
.morebtn .fill{position:absolute;left:0;top:0;bottom:0;background:#1d3a5f;
 transition:width .35s ease;z-index:0}
.morebtn .lbl{position:relative;z-index:1}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
 background:rgba(4,8,16,.72);padding:28px}
#modal[hidden]{display:none!important}
#modal .mbox{background:var(--card2);border:1px solid var(--line);border-radius:18px;
 padding:24px 22px;max-width:320px;text-align:center}
#modal .mtx{font-size:16px;line-height:1.6;font-weight:600}
#modal button{margin-top:16px;background:var(--acc);color:#04203f;border:0;
 border-radius:11px;padding:10px 24px;font:800 14px inherit}

/* ====== CHI TIET ====== */
#detail{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;
 -webkit-overflow-scrolling:touch}
.dhd{position:sticky;top:0;background:rgba(7,13,24,.97);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;gap:10px;align-items:center;z-index:2}
.dhd button{background:var(--card2);border:1px solid var(--line);color:var(--acc);
 font:800 16px inherit;padding:11px 18px;border-radius:12px;flex:none}
.dhd button:active{background:#2b3f66}
.dhd .t{font-weight:800;font-size:16px}
.dbody{max-width:760px;margin:0 auto;padding:12px 14px calc(34px + env(safe-area-inset-bottom,0px))}
.dtitle{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.dsub{color:#cfe0f7;font-weight:600;font-size:15px;margin-top:2px}
.ddate{color:var(--mut);font-size:13.5px;margin-top:4px}

.times{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0}
.times .r{display:flex;align-items:center;gap:11px;padding:6px 0;position:relative}
.times .r:not(:last-of-type):after{content:"";position:absolute;left:5px;top:22px;width:1px;
 height:calc(100% - 8px);background:var(--line)}
.times .dot{width:11px;height:11px;border-radius:50%;flex:none;z-index:1}
.times .t{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px;letter-spacing:-.5px}
.times .lb{font-size:12.5px;color:var(--mut);line-height:1.25}
.times .lb b{display:block;color:var(--fg);font-size:13.5px}
.r-mk .dot{background:var(--mk)}.r-mk .t{color:var(--mk)}
.r-br .dot{background:var(--br)}.r-br .t{color:var(--br)}
.r-to .dot{background:var(--acc)}.r-to .t{color:var(--acc);font-size:25px}
.times .note{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--mut)}

.sec{margin-top:18px}
.sec>h3{font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;
 font-weight:800;margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.leg{padding:8px 0;border-bottom:1px solid #1b2742}.leg:last-child{border-bottom:0}
.leg .l1{display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums;font-size:14px}
.leg .n{color:var(--acc);font-weight:800;min-width:48px}
.leg .p{font-weight:800}.leg .x{color:var(--mut);font-size:13px}
.leg .ap{font-size:11.5px;color:var(--mut);padding-left:56px;margin-top:1px}
.leg .ap.tail{color:#7fc0ff;font-weight:700;letter-spacing:.02em}
.lg .tailmini{margin-left:auto;font-size:11px;font-weight:700;color:#7fc0ff;
 font-variant-numeric:normal}
.lg .dh{margin-left:6px}
.crewrow{display:flex;gap:8px;font-size:13px;padding:4px 0;align-items:baseline}
.crewrow .ps{min-width:32px;font-weight:800;color:var(--acc);font-size:11px}
.crewrow .nm{flex:1}.crewrow .cid{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.crewrow.me .nm{color:#ffd479;font-weight:800}
.kv{display:flex;gap:10px;font-size:13.5px;padding:5px 0}
.kv span{color:var(--mut);min-width:108px}.kv b{flex:1;font-weight:600}

/* ====== PHAT THANH ====== */
.paheader{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pabtn{background:var(--card2);border:1px solid var(--line);color:var(--mut);
 border-radius:9px;padding:6px 11px;font:700 12px inherit}
.pabtn[aria-pressed=true]{background:#16314f;color:var(--acc);border-color:#2b5582}
.palabel{font-size:11px;font-weight:800;color:var(--acc);letter-spacing:.1em;
 text-transform:uppercase;margin:14px 0 6px}
.patext{white-space:pre-wrap;font:14px/1.65 inherit;background:var(--card);
 border:1px solid var(--line);border-radius:14px;padding:14px}
.patext mark{background:#3a2d12;color:#ffd479;border-radius:3px;padding:0 3px;font-weight:700}
.patext .fill{color:#7bd68e;font-weight:700}
.copy{margin-top:8px;background:var(--acc);color:#04203f;border:0;border-radius:11px;
 padding:11px 18px;font:800 14px inherit;width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 14px}
.cal .hd{text-align:center;font-size:10.5px;color:var(--mut);padding:3px 0;font-weight:800}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--card);border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:1px;cursor:pointer}
.cal .c.empty{background:none;border-color:transparent;cursor:default}
.cal .c .n{font-weight:700;font-size:12px}
.cal .c .b{font-size:8.5px;font-weight:800;line-height:1.05;text-align:center;overflow:hidden;max-width:100%}
.cal .c.today{outline:2px solid var(--acc);outline-offset:1px}
.cal .c[data-t=Flight]{background:#15314f}.cal .c[data-t=Hotel]{background:#3b2a12}
.cal .c[data-t=Off]{background:#17351c}.cal .c[data-t=Standby]{background:#0d3139}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat .b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.stat .b .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat .b .k{font-size:11px;color:var(--mut);margin-top:2px}
.paymonth{margin:14px 0 18px;padding-top:4px}
.paymonth.cur{scroll-margin-top:8px}
.pmhd{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.pmno{font-size:28px;font-weight:800;letter-spacing:-1px}
.paymonth.cur .pmno{color:var(--acc)}
.pmyr{font-size:14px;color:var(--mut);font-weight:700}
.pmrg{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600}
.mblk{margin:14px 0}
.mblk h3{font-size:12px;color:var(--acc);letter-spacing:.09em;text-transform:uppercase;
 font-weight:800;margin:0 0 8px}
.mrow{display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:var(--card);
 border:1px solid var(--line);border-bottom:0;font-size:14px}
.mrow:first-of-type{border-radius:13px 13px 0 0}
.mrow:last-of-type{border-radius:0 0 13px 13px;border-bottom:1px solid var(--line)}
.mrow span{color:var(--mut);flex:1}
.mrow b{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}
.mrow small{color:#64799a;font-size:11px;font-weight:600}
.mnote{font-size:11.5px;color:#64799a;margin:8px 2px 0;line-height:1.5}
.paybox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin:10px 0}
.pr{display:flex;align-items:baseline;gap:10px;padding:9px 0;font-size:13.5px;border-bottom:1px solid #1b2742}
.pr:last-child{border-bottom:0}.pr span{color:var(--mut);flex:1}
.pr b{font-variant-numeric:tabular-nums;font-weight:700}
.pr.tot span{color:var(--fg);font-weight:700}.pr.tot b{color:#7bd68e;font-size:16px}
.notice{background:#2a2113;border:1px solid #574424;border-radius:12px;padding:11px;
 font-size:12.5px;color:#ffd479;margin:10px 0;line-height:1.5}

.tabs{flex:none;display:flex;gap:4px;z-index:20;background:#0f1a2e;
 border-top:1px solid var(--line);
 padding:10px 8px 8px}
.tabs .in{max-width:760px;margin:0 auto;display:flex;gap:4px;width:100%}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:700 10px/1.25 inherit;
 padding:5px 1px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ic{font-size:16px}
.tabs button[aria-selected=true]{color:var(--acc);background:#16233c}
.pane{display:none}.pane.on{display:block}
.empty-msg{color:var(--mut);text-align:center;padding:34px 10px;font-size:14px}
.foot{text-align:center;color:#5b6b86;font-size:11px;padding:14px 0 4px}

/* ====== iPad / man hinh rong ====== */
@media (min-width:700px){

<body>

<div id="splash"><div class="sttl" id="sttl">Ecrew<span>Ultra</span></div></div>

<div id="shell">
<header id="hdr" hidden><div class="in">
  <div class="brand">
    <h1>Ecrew<span>Ultra</span></h1>
    <div class="sig">Tuấn Anh <span class="hr">♥</span> Hồng Huệ</div>
  </div>
  <button class="sub" id="stamp"></button>
</div></header>

<main id="scroll">
<div class="wrap">
  <div id="lock" class="lock">
    <h2>Ecrew<span>Ultra</span></h2>
    <p>Nhập mật khẩu để mở lịch. Chỉ hỏi một lần, lần sau vào thẳng.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu">
    <button id="go">Mở</button>
    <div class="err" id="err"></div>
  </div>

  <div id="app" hidden>
    <div class="pane on" id="p-sched"><div id="list"></div></div>
    <div class="pane" id="p-month"><div id="month"></div></div>
    <div class="pane" id="p-crew"><div id="crew"></div></div>
    <div class="pane" id="p-pay"><div id="pay"></div></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
</main>

<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-p="sched" aria-selected="true"><span class="ic">🗓</span>Lịch bay</button>
  <button data-p="month" aria-selected="false"><span class="ic">📊</span>Tháng này</button>
  <button data-p="crew" aria-selected="false"><span class="ic">👥</span>Tổ bay</button>
  <button data-p="pay" aria-selected="false"><span class="ic">⏱</span>Giờ bay</button>
</div></nav>
</div>

<div id="detail" hidden>
  <div class="dhd"><button id="back">‹ Quay lại</button><span class="t" id="dttl"></span></div>
  <div class="dbody" id="dbody"></div>
</div>

<div id="note" hidden>
  <div class="dhd"><button id="nback">‹ Quay lại</button><span class="t" id="ndate"></span></div>
  <div class="nbody">
    <div id="nmemo"></div>
    <div class="sec"><h3>Ghi chú của em</h3>
      <textarea id="ntext" placeholder="Ví dụ: đi học SEP, hẹn khám, sinh nhật..."></textarea>
      <button class="save" id="nsave">Lưu ghi chú</button></div>
  </div>
</div>

<div id="modal" hidden><div class="mbox">
  <div class="mtx" id="mtx"></div><button id="mok">Đóng</button></div>
</div>

<script>
const BUILD='20261027-001342';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* Tu phat hien ban moi tren may chu va nap lai mot lan duy nhat */
(async()=>{
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const v=(await r.json()).build;
    if(!v || v===BUILD){ sessionStorage.removeItem('reloaded'); return; }
    if(sessionStorage.getItem('reloaded')===v) return;
    sessionStorage.setItem('reloaded',v);
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(x=>x.unregister()));
    }
    location.reload();
  }catch(e){}
})();
const LSK='ecrew_key_v1', CACHE='ecrew_cache', NOTES='ecrew_notes';
/* Ghi chu: {ngay:{t,ts,pending,sent}} - luu may + dong bo qua Mac mini */
const readNotes=()=>{try{
  const o=JSON.parse(localStorage.getItem(NOTES)||'{}');
  for(const k in o) if(typeof o[k]==='string') o[k]={t:o[k],ts:1,pending:true};
  return o;
}catch(e){return {}}};
const writeNotes=o=>{try{localStorage.setItem(NOTES,JSON.stringify(o))}catch(e){}};
const noteOf=k=>{const n=readNotes()[k]; return n&&n.t?n.t.trim():''};
const notePending=k=>{const n=readNotes()[k]; return !!(n&&n.pending)};

function saveNote(k,v){
  const n=readNotes(), ts=Date.now(), t=v.trim();
  n[k]={t,ts,pending:true};
  writeNotes(n);
  pushNote(k,t,ts);
}
async function pushNote(k,t,ts){
  if(!DATA||!DATA.ntfy) return false;
  try{
    const r=await fetch('https://ntfy.sh/'+encodeURIComponent(DATA.ntfy),{method:'POST',
      body:JSON.stringify({cmd:'note',date:k,text:t,ts,req:String(ts)})});
    if(!r.ok) return false;
    const n=readNotes();
    if(n[k]&&n[k].ts===ts){ n[k].sent=true; writeNotes(n); }
    return true;
  }catch(e){ return false; }
}
async function flushNotes(){
  const n=readNotes();
  for(const k in n){ if(n[k].pending&&!n[k].sent) await pushNote(k,n[k].t||'',n[k].ts); }
}
function mergeNotes(){
  const srv=(DATA&&DATA.notes)||{}, loc=readNotes();
  let ch=false;
  for(const k in srv){
    const a=srv[k], b=loc[k];
    if(!b || (a.ts||0)>=(b.ts||0)){
      if(!b || b.t!==a.t || b.pending){ loc[k]={t:a.t,ts:a.ts||0}; ch=true; }
    }
  }
  for(const k in loc){
    if(loc[k].pending && !loc[k].t && !srv[k]){ delete loc[k]; ch=true; }
  }
  if(ch) writeNotes(loc);
}
const memoOf=k=>((DATA&&DATA.memos)||[]).filter(m=>m.d===k).map(m=>m.t).join('\n');
let DATA=null, CUR=null;
const ME='41057';
const BASE_TZ=7;   /* eCrew hien gio theo Local Base (HAN) */

const AP={
 HAN:{n:'Nội Bài',c:'Hà Nội',tz:7,vn:1}, SGN:{n:'Tân Sơn Nhất',c:'Thành phố Hồ Chí Minh',tz:7,vn:1},
 DAD:{n:'Đà Nẵng',c:'Đà Nẵng',tz:7,vn:1}, PQC:{n:'Phú Quốc',c:'Phú Quốc',tz:7,vn:1},
 CXR:{n:'Cam Ranh',c:'Khánh Hòa',tz:7,vn:1}, HPH:{n:'Cát Bi',c:'Hải Phòng',tz:7,vn:1},
 VII:{n:'Vinh',c:'Nghệ An',tz:7,vn:1}, HUI:{n:'Phú Bài',c:'Huế',tz:7,vn:1},
 VCA:{n:'Cần Thơ',c:'Cần Thơ',tz:7,vn:1}, UIH:{n:'Phù Cát',c:'Gia Lai',tz:7,vn:1},
 DLI:{n:'Liên Khương',c:'Lâm Đồng',tz:7,vn:1}, VCL:{n:'Chu Lai',c:'Quảng Ngãi',tz:7,vn:1},
 THD:{n:'Thọ Xuân',c:'Thanh Hóa',tz:7,vn:1}, VDO:{n:'Vân Đồn',c:'Quảng Ninh',tz:7,vn:1},
 TBB:{n:'Tuy Hòa',c:'Đắk Lắk',tz:7,vn:1}, BMV:{n:'Buôn Ma Thuột',c:'Đắk Lắk',tz:7,vn:1},
 PXU:{n:'Pleiku',c:'Gia Lai',tz:7,vn:1}, CAH:{n:'Cà Mau',c:'Cà Mau',tz:7,vn:1},
 SIN:{n:'Changi',c:'Singapore',tz:8}, BKK:{n:'Suvarnabhumi',c:'Bangkok',tz:7},
 DMK:{n:'Don Mueang',c:'Bangkok',tz:7}, HKG:{n:'Hong Kong',c:'Hồng Kông',tz:8},
 TPE:{n:'Đào Viên',c:'Đài Bắc',tz:8}, KHH:{n:'Cao Hùng',c:'Đài Loan',tz:8},
 ICN:{n:'Incheon',c:'Seoul',tz:9}, PUS:{n:'Gimhae',c:'Busan',tz:9},
 NRT:{n:'Narita',c:'Tokyo',tz:9}, HND:{n:'Haneda',c:'Tokyo',tz:9},
 KIX:{n:'Kansai',c:'Osaka',tz:9}, NGO:{n:'Chubu',c:'Nagoya',tz:9},
 PVG:{n:'Phố Đông',c:'Thượng Hải',tz:8}, CAN:{n:'Bạch Vân',c:'Quảng Châu',tz:8},
 KUL:{n:'Kuala Lumpur',c:'Kuala Lumpur',tz:8}, REP:{n:'Siem Reap',c:'Siem Reap',tz:7},
 PNH:{n:'Phnom Penh',c:'Phnom Penh',tz:7}, VTE:{n:'Wattay',c:'Viêng Chăn',tz:7},
 MFM:{n:'Macau',c:'Ma Cao',tz:8}, CGK:{n:'Soekarno-Hatta',c:'Jakarta',tz:7},
 MNL:{n:'Ninoy Aquino',c:'Manila',tz:8}, DEL:{n:'Indira Gandhi',c:'New Delhi',tz:5.5},
 BOM:{n:'Chhatrapati Shivaji',c:'Mumbai',tz:5.5}, SYD:{n:'Kingsford Smith',c:'Sydney',tz:11},
 MEL:{n:'Tullamarine',c:'Melbourne',tz:11}
};
const apN=c=>AP[c]?AP[c].n:c, apC=c=>AP[c]?AP[c].c:c, apTZ=c=>AP[c]?AP[c].tz:BASE_TZ;
const apFull=c=>AP[c]?AP[c].n+' · '+AP[c].c:c;
const PAY={base:7000000,makeup:300000,phone:300000,stationery:300000,uniform:410000,
  hourly:254000,overThreshold:85,sector:127000,ferry:76200,quality:7690000,
  guaranteed:19500000,score:100};

/* ---------- ma hoa ---------- */
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['decrypt']);
}
const decrypt=async(e,k)=>JSON.parse(new TextDecoder().decode(
  await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},k,b64d(e.ct))));
async function fetchEnc(){
  const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('no data'); return r.json();
}

/* ---------- tien ich ---------- */
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const DOWF=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const fullDate=k=>{const d=D(k+'T00:00:00');
  return DOWF[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();};
const addDay=(k,n)=>{const d=D(k+'T00:00:00');d.setDate(d.getDate()+n);
  return [d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');};
const pad=n=>String(n).padStart(2,'0');
const dmark=n=>n?'\u207a'+['\u2070','\u00b9','\u00b2','\u00b3'][n]||'':'';
const D=s=>s?new Date(s.replace(' ','T')):null;
const hm=s=>{const d=D(s);return d?pad(d.getHours())+':'+pad(d.getMinutes()):''};
const dkey=s=>s?s.slice(0,10):'';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TYPE={Flight:'Bay',Hotel:'Khách sạn',Off:'Ngày nghỉ',Standby:'Trực',
  Training:'Huấn luyện',Default:'Khác'};
const fmt=t=>pad(t.getHours())+':'+pad(t.getMinutes());
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
function takeoff(d){
  if(!d.legs||!d.legs.length||!d.legs[0].dep) return null;
  const b=D(d.s); if(!b) return null;
  const l0=d.legs[0];
  const t=new Date(b); t.setHours(+l0.dep.slice(0,2),+l0.dep.slice(2),0,0);
  if(l0.dd) t.setDate(t.getDate()+l0.dd);
  else if(t<b) t.setDate(t.getDate()+1);
  return t;
}
const shift=(t,m)=>new Date(t.getTime()+m*60000);
function legMin(l){
  if(!l.dep||!l.arr) return 0;
  let a=(l.dd||0)*1440 + (+l.dep.slice(0,2))*60 + (+l.dep.slice(2));
  let b=(l.ad||0)*1440 + (+l.arr.slice(0,2))*60 + (+l.arr.slice(2));
  if(b<a) b+=1440;
  return b-a;
}
const hhmm=m=>Math.floor(m/60)+'h'+pad(Math.round(m%60));

/* ---------- PHAT THANH ---------- */
function buoi(h){return h<11?'sáng':h<13?'trưa':h<18?'chiều':'tối'}
/* gio dia phuong noi den = gio hien thi (base HAN) + chenh mui gio */
function localArr(l){
  const [H,M]=[+l.arr.slice(0,2),+l.arr.slice(2)];
  let h=H+(apTZ(l.to)-BASE_TZ);
  if(h>=24)h-=24; if(h<0)h+=24;
  return {h,m:M};
}
const B=t=>`<span class="fill">${t}</span>`;
const Q=t=>`<mark>${t}</mark>`;

function paVI(duty,l){
  const t=localArr(l), cap=duty.captain||'______', cm=duty.cmName||'______';
  const diff=apTZ(l.to)-BASE_TZ;
  return `Thưa quý khách,

Chào mừng quý khách đến sân bay ${B(apN(l.to))}, ${B(apC(l.to))}.

Bây giờ là ${B(t.h+' giờ '+pad(t.m)+' phút')} ${B(buoi(t.h))}${diff?' (giờ địa phương)':''}. Nhiệt độ bên ngoài là ${Q('___')} độ C.

Quý khách lưu ý ngồi yên tại chỗ với dây an toàn được cài chặt cho đến khi máy bay dừng hẳn và đèn hiệu cài dây an toàn được tắt. Quý khách cẩn thận khi mở ngăn đựng hành lý và kiểm tra kỹ tư trang trước khi rời máy bay.

Quý khách không mở cửa thoát hiểm của máy bay khi không có sự yêu cầu và hướng dẫn từ Tiếp viên.

Thay mặt cho hãng hàng không Mặt trời Phú Quốc, cơ trưởng ${B(cap)}, Tiếp viên trưởng ${B(cm)} cùng toàn thể phi hành đoàn xin kính chào tạm biệt. Chúc quý khách có thời gian lưu trú tuyệt vời tại ${B(apC(l.to))} và hy vọng được phục vụ quý khách trong những chuyến bay sắp tới.

Trân trọng cảm ơn.

— Khi khách rời máy bay bằng ỐNG LỒNG:
Quý khách sẽ rời máy bay bằng cửa phía trước và nhận hành lý ký gửi tại băng chuyền số ${Q('___')}.

— Khi khách rời máy bay bằng XE THANG:
Quý khách sẽ rời máy bay bằng cửa phía trước và phía sau.
Xin lưu ý quan sát bậc thang, sử dụng tay nắm để tránh trơn trượt.
Quý khách sẽ nhận hành lý ký gửi tại băng chuyền số ${Q('___')}.`;
}
function paEN(duty,l){
  const t=localArr(l), cap=duty.captain||'______', cm=duty.cmName||'______';
  const ampm=t.h<12?'a.m':'p.m', h12=t.h%12===0?12:t.h%12;
  const diff=apTZ(l.to)-BASE_TZ;
  return `Ladies and gentlemen,

We have now arrived at ${B(apN(l.to))} airport, ${B(apC(l.to))}.

It is now ${B(h12+':'+pad(t.m)+' '+ampm)}${diff?' (local time)':''}. The outside temperature is ${Q('___')} degrees Celsius.

Please remain seated with your seat belt fastened until the aircraft has come to a complete stop and the "Fasten seat belt" sign has been turned off. Be careful when opening the overhead lockers to ensure the contents do not fall out and do not leave any of your belongings behind.

You are requested not to open the aircraft door unless instructed by the cabin crew.

On behalf of Sun PhuQuoc Airways, Captain ${B(cap)}, Cabin Manager ${B(cm)} and all crew member would like to say goodbye to you and we wish you have a pleasant stay in ${B(apC(l.to))}.

We look forward to meeting you again soon. Thank you.

— AIRBRIDGE:
Disembarkation will be through the front door. Your checked baggage will be available at baggage belt number ${Q('___')}.

— STAIR CAR:
Disembarkation will be through the front and the rear doors.
Please watch your steps and hold the handrail while going down. If you need assistance, please remain in your seat.
Your checked baggage will be available at baggage belt number ${Q('___')}.`;
}

/* ---------- CHI TIET DUTY ---------- */
function openDetail(d){
  CUR=d;
  const nm=d.type==='Hotel'&&d.hotel?d.hotel.name:(d.code||TYPE[d.type]||d.type);
  $('#dttl').textContent=new Date(d.s).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
  const to=takeoff(d);
  const title=d.reg?d.reg:nm;
  const sub=d.reg
    ? `${esc(nm)}${d.route?' · '+esc(d.route):''}${d.regs?' · '+d.regs.length+' tàu':''}`
    : esc(d.route||apFull(d.loc)||'');
  let h=`<div class="dtitle">${esc(title)}</div>
    <div class="dsub">${sub}</div>
    <div class="ddate">${DOW[D(d.s).getDay()]}, ${D(d.s).toLocaleDateString('vi-VN')}
      · ${hm(d.s)} – ${hm(d.e)}${d.dh?' · <span class="badge">DHC</span>':''}</div>`;

  if(to){
    const br=shift(to,-150), mk=shift(to,-270), dd=t=>sameDay(t,to)?'':' (hôm trước)';
    h+=`<div class="times">
      <div class="r r-mk"><span class="dot"></span><span class="t">${fmt(mk)}</span>
        <span class="lb"><b>Bắt đầu chuẩn bị</b>trang điểm, quần áo${dd(mk)}</span></div>
      <div class="r r-br"><span class="dot"></span><span class="t">${fmt(br)}</span>
        <span class="lb"><b>Có mặt briefing</b>trước cất cánh 2 giờ 30${dd(br)}</span></div>
      <div class="r r-to"><span class="dot"></span><span class="t">${fmt(to)}</span>
        <span class="lb"><b>CẤT CÁNH</b>${d.legs[0].fl} · ${d.legs[0].from} → ${d.legs[0].to}</span></div>
      ${d.report?`<div class="note">Giờ báo cáo eCrew: <b>${d.report}</b>. Nếu sớm hơn giờ briefing ở trên thì đi theo giờ eCrew.</div>`:''}
    </div>`;
  }

  if(d.legs&&d.legs.length){
    h+=`<div class="sec"><h3>Chặng bay</h3><div class="box">`+
      d.legs.map(l=>{
        const df=apTZ(l.to)-apTZ(l.from);
        return `<div class="leg"><div class="l1"><span class="n">${l.fl}</span>
          <span class="p">${l.from}</span><span class="x">${l.dep}${dmark(l.dd)}</span><span class="x">→</span>
          <span class="p">${l.to}</span><span class="x">${l.arr}${dmark(l.ad)}</span>
          <span class="x">· ${hhmm(legMin(l))}</span>${df?`<span class="x">· lệch ${df>0?'+':''}${df}h</span>`:''}</div>
          <div class="ap">${apFull(l.from)} → ${apFull(l.to)}</div>
          ${l.reg?`<div class="ap tail">✈ ${esc(l.reg)}${l.ac?' · '+esc(l.ac):''}</div>`:''}</div>`;
      }).join('')+`</div></div>`;
  }

  const crew=d.crew||[];
  if(crew.length){
    h+=`<div class="sec"><h3>Tổ bay (${crew.length})</h3><div class="box">`+
      crew.map(c=>`<div class="crewrow${c.cid==ME?' me':''}">
        <span class="ps">${c.pos}</span>
        <span class="nm">${esc(c.name)}${c.dhc?' <span class="badge">DHC</span>':''}${c.pic?' <span class="badge cap">PIC</span>':''}</span>
        <span class="cid">${c.cid}</span></div>`).join('')+`</div></div>`;
  }

  if(d.hotel){
    const x=d.hotel;
    h+=`<div class="sec"><h3>Khách sạn</h3><div class="box">
      <div class="kv"><span>Tên</span><b>${esc(x.name||'—')}</b></div>
      <div class="kv"><span>Nhận phòng</span><b>${x.in||'—'} ${x.inDate||''}</b></div>
      <div class="kv"><span>Trả phòng</span><b>${x.out||'—'} ${x.outDate||''}</b></div>
      ${x.tel?`<div class="kv"><span>Điện thoại</span><b>${esc(x.tel)}</b></div>`:''}
      ${x.addr?`<div class="kv"><span>Địa chỉ</span><b>${esc(x.addr)}</b></div>`:''}
      ${x.toAirport?`<div class="kv"><span>Xe ra sân bay</span><b>${esc(x.toAirport)}</b></div>`:''}
    </div></div>`;
  }

  const dk=dkey(d.s), dmemo=memoOf(dk), dnote=noteOf(dk);
  if(dmemo) h+=`<div class="sec"><h3>Ghi chú từ eCrew</h3>
    <div class="box" style="white-space:pre-wrap;color:#ffd479">${esc(dmemo)}</div></div>`;
  h+=`<div class="sec"><h3>Ghi chú của em</h3>
    <div class="box" style="white-space:pre-wrap">${dnote?esc(dnote):'<span style="color:var(--mut)">Chưa có ghi chú. Bấm để thêm.</span>'}</div>
    <button class="copy" data-note="${dk}" style="margin-top:8px">${dnote?'Sửa ghi chú':'Thêm ghi chú'}</button></div>`;
  if(d.details){
    h+=`<div class="sec"><h3>Nguyên văn eCrew</h3><div class="box">

/* ---------- DANH SACH KIEU ECREW ---------- */
function landing(d){
  if(!d.legs||!d.legs.length) return D(d.e);
  const l=d.legs[d.legs.length-1], b=D(d.s); if(!b||!l.arr) return D(d.e);
  const t=new Date(b); t.setHours(+l.arr.slice(0,2),+l.arr.slice(2),0,0);
  while(t<b) t.setDate(t.getDate()+1);
  return t;
}
function restText(prevDuty,nextDuty,hotel){
  const a=prevDuty?landing(prevDuty):null;
  const b=nextDuty?takeoff(nextDuty):null;
  if(!a||!b) return '';
  const mins=Math.round((b-a)/60000);
  if(mins<=0) return '';
  const f=t=>pad(t.getDate())+'/'+pad(t.getMonth()+1)+' '+fmt(t);
  return `Nghỉ ${hhmm(mins)} — từ ${f(a)} (đáp) đến ${f(b)} (cất cánh)`;
}

function buildGroups(ds){
  const g=[],n=ds.length; let i=0;
  while(i<n){
    const d=ds[i];
    if(d.type!=='Flight'){ g.push({items:[{k:'d',d,i}]}); i++; continue; }
    const items=[{k:'d',d,i}]; let j=i+1;
    while(j<n&&ds[j].type==='Hotel'){
      const h=j; j++;
      if(j<n&&ds[j].type==='Flight'){
        items.push({k:'h',d:ds[h],i:h,prev:ds[h-1],next:ds[j]});
        items.push({k:'d',d:ds[j],i:j}); j++;
      }else{ items.push({k:'h',d:ds[h],i:h,prev:ds[h-1],next:null}); break; }
    }
    g.push({items}); i=j;
  }
  return g;
}

function dutyHTML(d,i){
  const to=takeoff(d);
  const dt=D(d.s), today=new Date().toISOString().slice(0,10)===dkey(d.s);
  let h=`<div class="dayhd"><span class="dd">${fullDate(dkey(d.s))}</span>
    ${today?'<span class="tg">HÔM NAY</span>':''}</div>`;
  if(to){
    h+=`<div class="prep">
      <div class="m"><div class="t">${fmt(shift(to,-270))}</div><div class="k">CHUẨN BỊ</div></div>
      <div class="b"><div class="t">${fmt(shift(to,-150))}</div><div class="k">BRIEFING</div></div>
      <div class="o"><div class="t">${fmt(to)}</div><div class="k">CẤT CÁNH</div></div>
    </div>`;
  }
  h+=`<div class="duty" data-i="${i}">`;
  if(d.report) h+=`<div class="rep"><span>Reporting time :</span> ${d.report}</div>`;
  if(d.legs&&d.legs.length){
    h+='<div class="lgs">'+d.legs.map(l=>`<div class="lg">
      <span class="fn">${l.fl}</span><span class="tm">${l.dep}</span>
      <span class="ar">${l.from} ${l.to}</span><span class="tm">${l.arr}${dmark(l.ad)}</span>
      ${l.reg?`<span class="tailmini">${esc(l.reg)}</span>`:''}
      ${d.dh?'<span class="dh">DHC</span>':''}</div>`).join('')+'</div>';
  }else{
    const nm=d.code||TYPE[d.type]||d.type;
    h+=`<div class="lgs"><div class="lg"><span class="fn">${esc(nm)}</span>
      <span class="tm">${hm(d.s)}</span><span class="ar">${esc(d.loc||'')}</span>
      <span class="tm">${hm(d.e)}</span></div></div>`;
    if(d.route&&d.type!=='Off') h+=`<div class="rep"><span>${esc(d.route)}</span></div>`;
  }
  if(d.debrief) h+=`<div class="rep"><span>Debriefing time :</span> ${d.debrief}</div>`;
  h+='</div>';
  const k=dkey(d.s), mm=memoOf(k), nn=noteOf(k);
  if(mm) h+=`<div class="memo"><b>Ghi chú từ eCrew</b>${esc(mm)}</div>`;
  if(nn) h+=`<div class="mynote"><b>Ghi chú của em${notePending(k)?' · đang gửi':''}</b>${esc(nn)}</div>`;
  return h;
}

function groupHTML(g){
  const first=g.items[0].d;
  let h=`<div class="grp ${first.type}">`;
  g.items.forEach(it=>{
    if(it.k==='d') h+=dutyHTML(it.d,it.i);
    else{
      const nm=(it.d.hotel&&it.d.hotel.name)||it.d.code||'Nghỉ tại khách sạn';
      h+=`<div class="htl"><div class="nm">${esc(nm)}</div>
        <div class="rs">${esc(restText(it.prev,it.next,it.d))}</div></div>`;
    }
  });
  return h+'</div>';
}

/* Chay mot lan cap nhat that. Tra ve {ok, changed} hoac {ok:false, msg} */
async function runRefresh(ui){
  const saved=localStorage.getItem(LSK);
  if(!saved) return {ok:false,msg:'Chưa mở khóa dữ liệu.'};
  if(!DATA||!DATA.ntfy) return {ok:false,
    msg:'Chưa có cấu hình cập nhật.<br>Nhờ chồng chạy setup_listener.sh trên Mac mini.'};
  let key;
  try{ key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},true,['decrypt']); }
  catch(e){ return {ok:false,msg:'Không mở được khóa đã lưu.<br>Hãy nhập lại mật khẩu.'}; }

  const oldGen=DATA.gen, req=String(Date.now()), t0=Date.now();
  const base='https://ntfy.sh/'+encodeURIComponent(DATA.ntfy), stBase=base+'-st';
  let since=Math.floor(t0/1000)-1;

  /* Ket noi thuong truc (SSE) thay vi hoi lien tuc -> khong bi gioi han tan suat */
  const queue=[];
  let es=null;
  try{
    es=new EventSource(stBase+'/sse?since='+since);
    es.onmessage=ev=>{ try{ queue.push(JSON.parse(ev.data)); }catch(e){} };
    es.onerror=()=>{};
  }catch(e){ es=null; }
  const stop=()=>{ try{ if(es) es.close(); }catch(e){} };

  ui.start();
  try{
    const sent=await fetch(base,{method:'POST',body:JSON.stringify({cmd:'refresh',req})});
    if(!sent.ok) throw new Error('send');
  }catch(e){ stop(); return {ok:false,msg:'Không gửi được lệnh tới Mac mini.<br>Kiểm tra mạng rồi thử lại.'}; }

  let real=0, shown=0, gotRun=false, phase='wait', lastPoll=0;
  let spent=0, tick=Date.now();
  const bump=()=>{ const n=Date.now(), g=n-tick; tick=n;
    spent += g>20000 ? 800 : g; return spent; };

  const handle=q=>{
    if(!q||q.req!==req) return null;
    if(q.st==='login') return {ok:false,msg:'Cần đăng nhập lại eCrew trên Mac mini.'};
    if(q.st==='busy')  return {ok:false,msg:'Mac mini đang đồng bộ,<br>thử lại sau ít phút.'};
    if(q.st==='err')   return {ok:false,msg:'Mac mini gặp lỗi khi cập nhật.'};
    if(q.st==='run'){ gotRun=true; real=Math.max(real,q.p||0); ui.prog(Math.max(real,shown),q.msg); }
    if(q.st==='noteok'){ gotRun=true; }
    if(q.st==='same'){
      if(q.gen){ DATA.gen=q.gen;
        try{localStorage.setItem(CACHE,JSON.stringify(DATA))}catch(e){} }
      ui.prog(100,'Lịch không có gì thay đổi'); render();
      return {ok:true,changed:false};
    }
    if(q.st==='ok'){ gotRun=true; phase='pages'; ui.prog(96,'Đang tải lịch mới về'); }
    return null;
  };

  for(;;){
    const el=bump();
    if(!gotRun && el>90000){ stop();
      return {ok:false,msg:'Mac mini chưa phản hồi.<br>Kiểm tra máy có bật và nối mạng.'}; }
    if(el>420000){ stop(); return {ok:false,msg:'Mac mini bận quá lâu.<br>Thử lại sau ít phút.'}; }
    await sleep(700);

    while(queue.length){
      const r=handle(queue.shift());
      if(r){ stop(); return r; }
    }

    /* Du phong: thinh thoang hoi mot lan phong khi SSE bi chan */
    if(Date.now()-lastPoll>6000){
      lastPoll=Date.now();
      try{
        const msgs=await ntfyPoll(stBase+'/json?poll=1&since='+since);
        for(const m of msgs){
          if(m.event!=='message') continue;
          if(m.time>since) since=m.time;
          let q; try{q=JSON.parse(m.message)}catch(e){continue}
          const r=handle(q);
          if(r){ stop(); return r; }
        }
      }catch(e){}
    }

    if(phase==='pages'){
      try{
        const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
        const j=await r.json();
        if(j.gen&&j.gen!==oldGen){
          DATA=await decrypt(j,key);
          try{localStorage.setItem(CACHE,JSON.stringify(DATA))}catch(e){}
          ui.prog(100); render(); stop();
          return {ok:true,changed:true};
        }
      }catch(e){}
      ui.prog(97);
    }else{
      const by=Math.min(92, Math.max(real, 8 + el/1000*2.6));
      shown=Math.max(shown,by);
      ui.prog(shown, gotRun?undefined:'Đang chờ Mac mini ('+Math.round(el/1000)+'s)');
    }
  }
}

async function forceRefresh(){

}

async function loadNextMonth(){
  if(busyNow) return;
  const LBL='Tải các chuyến bay sắp tới';
  busyNow=true;
  const today=new Date().getDate();
  if(today<26){
    /* Truoc ngay 26 hang thang chua the co lich moi: giu nguyen mot cau */
    const ui=btnUI('#nextbtn',LBL,0);
    const dur=3000+Math.random()*2000;
    ui.start();
    const t0=Date.now();
    for(;;){
      const e=Date.now()-t0;
      if(e>=dur) break;
      await sleep(100);
      ui.prog(Math.min(99,e/dur*100));
    }
    ui.prog(100); await sleep(280);
    ui.reset(); busyNow=false; showModal(NO_NEW);
    return;
  }
  /* Tu ngay 26: cap nhat that, doi cau moi 5 giay */
  const ui=btnUI('#nextbtn',LBL,5000);
  const before=(DATA.duties||[]).length;
  const r=await runRefresh(ui);

  const after=(DATA.duties||[]).length;
  if(r.changed && after>before){
    $('#scroll').scrollTop=$('#scroll').scrollHeight;
  }else{
    showModal(NO_NEW);
  }
}

function render(){
  mergeNotes();
  const ds=DATA.duties||[];
  setStamp();

  const today=new Date().toISOString().slice(0,10);
  const groups=buildGroups(ds);

  const used=new Set();
  ds.forEach(d=>{
    let k=dkey(d.s); const kEnd=dkey(d.e||d.s);
    for(let i=0;i<40 && k<=kEnd;i++){ used.add(k); k=addDay(k,1); }
  });

  const items=groups.map(g=>({
    k:dkey(g.items[0].d.s),
    last:dkey(g.items[g.items.length-1].d.e||g.items[g.items.length-1].d.s),
    html:groupHTML(g)
  }));
  if(ds.length){
    const starts=ds.map(d=>dkey(d.s)).sort();
    const ends=ds.map(d=>dkey(d.e||d.s)).sort();
    let k=starts[0]; const last=ends[ends.length-1];
    for(let i=0;i<400 && k<=last;i++){
      if(!used.has(k)){
        const mm=memoOf(k), nn=noteOf(k);
        items.push({k,last:k,html:
          `<div class="grp none" data-note="${k}"><div class="dayhd">
             <span class="dd">${fullDate(k)}</span>
             <span class="nolbl">${mm||nn?'Có ghi chú ›':'Không có lịch ›'}</span></div>
           ${mm?`<div class="memo"><b>Ghi chú từ eCrew</b>${esc(mm)}</div>`:''}
           ${nn?`<div class="mynote"><b>Ghi chú của em${notePending(k)?' · đang gửi':''}</b>${esc(nn)}</div>`:''}</div>`});
      }
      k=addDay(k,1);
    }
  }
  items.sort((x,y)=>x.k<y.k?-1:x.k>y.k?1:0);

  const past=[],future=[];
  items.forEach(it=>{ (it.last<today?past:future).push(it); });

  let h='';
  if(past.length){
    h+=`<button class="morebtn" id="pastbtn">▾ Các chuyến bay trước (${past.length})</button>
        <div id="pastwrap" hidden>${past.map(x=>x.html).join('')}</div>`;
  }
  h+=future.length?future.map(x=>x.html).join('')
     :'<div class="empty-msg">Không còn chuyến nào sắp tới trong kỳ này.</div>';
  h+=`<button class="morebtn" id="nextbtn">Tải các chuyến bay sắp tới</button>`;
  $('#list').innerHTML=h;

  const pb=$('#pastbtn');
  if(pb) pb.onclick=()=>{
    const w=$('#pastwrap'); w.hidden=!w.hidden;
    pb.textContent=(w.hidden?'▾':'▴')+` Các chuyến bay trước (${past.length})`;
  };
  $('#nextbtn').onclick=loadNextMonth;

  renderMonth(ds);

  const fls=(DATA.flights||[]).filter(f=>f.crew&&f.crew.length);
  $('#crew').innerHTML=fls.length?fls.map(f=>`<div class="sec">
      <h3>${f.date} · ${f.fl} · ${f.from}→${f.to}</h3><div class="box">
      ${f.crew.map(c=>`<div class="crewrow${c.cid==ME?' me':''}">
        <span class="ps">${c.pos}</span><span class="nm">${esc(c.name)}${c.dhc?' <span class="badge">DHC</span>':''}${c.pic?' <span class="badge cap">PIC</span>':''}</span>
        <span class="cid">${c.cid}</span></div>`).join('')}</div></div>`).join('')
    :'<div class="empty-msg">Chưa có dữ liệu tổ bay.</div>';

  renderPay(ds);
  $('#foot').textContent='Kỳ '+(DATA.period?.start||'')+' → '+(DATA.period?.end||'')+' · bản '+BUILD;
}

};


const VN=c=>!!(AP[c]&&AP[c].vn);
const ymd=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');
/* Bang "Thang nay": tu ngay 1 thang hien tai den het ngay cuoi thang sau */
function monthRange(){
  const n=new Date();
  return {from:ymd(new Date(n.getFullYear(),n.getMonth(),1)),
          to:ymd(new Date(n.getFullYear(),n.getMonth()+1,0))};
}
/* Bang "Gio & luong": ky luong bat dau ngay 25 hang thang */
/* Ky luong thang N = 26 thang truoc -> 25 thang N */
function payRange(off){
  const n=new Date();
  const m=new Date(n.getFullYear(),n.getMonth()+(off||0),1);
  const s=new Date(m.getFullYear(),m.getMonth()-1,26);
  const e=new Date(m.getFullYear(),m.getMonth(),25);
  return {from:ymd(s),to:ymd(e),month:m.getMonth()+1,year:m.getFullYear()};
}
const inRange=(d,r)=>{const k=dkey(d.s); return k>=r.from&&k<=r.to;};
const dmy=k=>k?k.slice(8,10)+'/'+k.slice(5,7)+'/'+k.slice(0,4):'';
function monthStats(list){
  let legs=0, mins=0, off=0, dhc=0, early=0, intl=0, lay=0, tr=0;
  list.forEach(d=>{
    if(d.type==='Off'){ off++; return; }
    if(d.type==='Hotel'){ lay++; return; }
    if(d.type==='Training'){ tr++; return; }
    const to=takeoff(d);
    if(to && shift(to,-270).getHours()<5) early++;
    (d.legs||[]).forEach(l=>{
      legs++; mins+=legMin(l);
      if(d.dh) dhc++;
      if(!VN(l.from)||!VN(l.to)) intl++;
    });
  });
  return {legs,mins,off,dhc,early,intl,lay,tr};
}
function statBlock(title,st){
  const row=(k,v,note)=>`<div class="mrow"><span>${k}${note?` <small>${note}</small>`:''}</span><b>${v}</b></div>`;
  return `<div class="mblk"><h3>${title}</h3>
    ${row('Chuyến bay',st.legs,'số chặng')}
    ${row('Giờ bay',hhmm(st.mins))}
    ${row('Ngày day off',st.off)}
    ${row('Chặng DHC',st.dhc)}
    ${row('Ngày phải dậy sớm',st.early,'chuẩn bị trước 05:00')}
    ${row('Chặng bay quốc tế',st.intl)}
    ${row('Ngày layover',st.lay,'nghỉ qua đêm ngoài căn cứ')}
    ${st.tr?row('Ngày huấn luyện',st.tr):''}
  </div>`;
}
function expiryHTML(){
  const xs=(DATA&&DATA.expiries)||[];
  if(!xs.length) return '';
  const now=new Date();
  const toD=t=>{const m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(t||''); 
    return m?new Date(+m[3],+m[2]-1,+m[1]):null;};
  return `<div class="mblk"><h3>Chứng chỉ &amp; giấy tờ</h3>`+
    xs.map(x=>{
      const dd=toD(x.exp), days=dd?Math.round((dd-now)/86400000):null;
      const warn=days!==null&&days<90;
      return `<div class="mrow"><span>${esc(x.desc||x.code)} <small>${esc(x.code)}</small></span>
        <b style="font-size:13.5px${warn?';color:#ff8e8e':''}">${esc(x.exp||'—')}</b></div>`;
    }).join('')+`</div>`;
}

function renderMonth(ds){
  const r=monthRange(), now=new Date();
  const inM=ds.filter(d=>inRange(d,r));
  const left=inM.filter(d=>D(d.e)>now);
  $('#month').innerHTML=
    statBlock('Tổng quan cả tháng', monthStats(inM))+
    statBlock('Những chuyến bay còn lại', monthStats(left))+
    expiryHTML()+
    `<div class="mnote">Tính từ <b>${dmy(r.from)}</b> đến hết <b>${dmy(r.to)}</b>,
      tức trọn tháng ${new Date().getMonth()+1}.<br>
      Giờ bay tính theo giờ khởi hành và hạ cánh của từng chặng.
      "Ngày phải dậy sớm" đếm ngày bay có giờ bắt đầu chuẩn bị trước 05:00.
      "Chặng bay quốc tế" đếm chặng có điểm đi hoặc đến ngoài Việt Nam.</div>`;
}

function payBox(all,off){
  const pr=payRange(off);
  const ds=all.filter(d=>inRange(d,pr));
  const flights=ds.filter(d=>d.type==='Flight');
  let comH=0,ferH=0,sectors=0;
  flights.forEach(d=>(d.legs||[]).forEach(l=>{sectors++;const m=legMin(l);
    if(d.dh)ferH+=m/60;else comH+=m/60;}));
  const dutyMin=ds.filter(d=>d.type!=='Off').reduce((a,d)=>{
    const x=D(d.s),y=D(d.e);return a+(x&&y?(y-x)/60000:0)},0);
  const P=PAY, fixed=P.base+P.makeup+P.phone+P.stationery+P.uniform;
  const hN=Math.min(comH,P.overThreshold),hO=Math.max(0,comH-P.overThreshold);
  const payHour=hN*P.hourly+hO*P.hourly*1.3, paySec=sectors*P.sector, payFer=ferH*P.ferry;
  const II=(payHour+paySec+payFer+P.quality)*(P.score/100);
  const A=fixed+II, applied=Math.max(A,P.guaranteed);
  const vnd=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
  const empty=ds.length===0;
  return `<div class="paymonth cur">
    <div class="pmhd"><span class="pmno">Tháng ${pr.month}</span>
      <span class="pmyr">${pr.year}</span>
      <span class="pmrg">${dmy(pr.from)} – ${dmy(pr.to)}</span></div>
    ${empty?'<div class="empty-msg">Chưa có lịch cho kỳ này.</div>':`
    <div class="stat">
      <div class="b"><div class="v">${hhmm(comH*60)}</div><div class="k">Giờ bay thương mại</div></div>
      <div class="b"><div class="v">${sectors}</div><div class="k">Số chặng</div></div>
      <div class="b"><div class="v">${hhmm(ferH*60)}</div><div class="k">Giờ bay chuyển sân</div></div>
      <div class="b"><div class="v">${hhmm(dutyMin)}</div><div class="k">Giờ làm nhiệm vụ</div></div>
    </div>
    <div class="paybox">
      <div class="pr"><span>Thu nhập cố định</span><b>${vnd(fixed)}</b></div>
      <div class="pr"><span>Giờ bay · ${comH.toFixed(2)}h × ${P.hourly.toLocaleString('vi-VN')}</span><b>${vnd(payHour)}</b></div>
      <div class="pr"><span>Chặng bay · ${sectors} × ${P.sector.toLocaleString('vi-VN')}</span><b>${vnd(paySec)}</b></div>
      ${ferH>0?`<div class="pr"><span>Chuyển sân · ${ferH.toFixed(2)}h × ${P.ferry.toLocaleString('vi-VN')}</span><b>${vnd(payFer)}</b></div>`:''}
      <div class="pr"><span>Thưởng ý thức chất lượng</span><b>${vnd(P.quality)}</b></div>
      <div class="pr tot"><span>Tạm tính trước thuế</span><b>${vnd(applied)}</b></div>
    </div>`}
  </div>`;
}

let payOff=0;
function hasPayData(all,off){
  const pr=payRange(off);
  return all.some(d=>inRange(d,pr));
}
function renderPay(all){
  $('#pay').innerHTML=
    `<button class="morebtn" id="payprev">▴ Tháng trước</button>`+
    payBox(all,payOff)+
    `<button class="morebtn" id="paynext">▾ Tháng sau</button>
     <div class="mnote">Kỳ lương của một tháng tính từ <b>ngày 26 tháng trước</b>
       đến <b>ngày 25 tháng đó</b>.<br>
       Ước tính <b>trước thuế</b> theo đơn giá bậc CM4 phiếu lương 9/2026.
       Chưa gồm layover, phụ cấp vị trí, truy lĩnh.
       Chưa trừ BHXH, công đoàn, thuế TNCN.</div>`;
  const go=step=>{
    const t=payOff+step;
    if(!hasPayData(all,t)){ showModal('Chưa có dữ liệu chình iu ạ 💛'); return; }
    payOff=t; renderPay(all); $('#scroll').scrollTop=0;
  };
  $('#payprev').onclick=()=>go(-1);
  $('#paynext').onclick=()=>go(1);
}

function show(){
  $('#lock').hidden=true; $('#app').hidden=false;
  $('#tabs').hidden=false; $('#hdr').hidden=false; render();
}
async function boot(){
  const saved=localStorage.getItem(LSK);
  if(saved){
    try{
      const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},true,['decrypt']);
      let d=null;
      try{ d=await decrypt(await fetchEnc(),key); localStorage.setItem(CACHE,JSON.stringify(d)); }
      catch(e){ const c=localStorage.getItem(CACHE); if(c) d=JSON.parse(c); }
      if(d){ DATA=d; show(); flushNotes(); return; }
    }catch(e){}
  }
  $('#lock').hidden=false;
}
$('#go').onclick=async()=>{
  const pw=$('#pw').value; if(!pw) return;
  $('#err').textContent='Đang mở…';
  try{
    const enc=await fetchEnc();
    const key=await deriveKey(pw,b64d(enc.salt),enc.iter||210000);
    DATA=await decrypt(enc,key);
    localStorage.setItem(LSK,b64e(await crypto.subtle.exportKey('raw',key)));
    try{localStorage.setItem(CACHE,JSON.stringify(DATA))}catch(e){}
    $('#err').textContent=''; $('#pw').value=''; show();
  }catch(e){ $('#err').textContent='Mật khẩu không đúng hoặc chưa có dữ liệu.'; }
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  $$('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  $('#scroll').scrollTop=0;
  if(b.dataset.p==='pay'){ payOff=0; renderPay(DATA.duties||[]); }};
/* ---------- man hinh mo dau ---------- */
const PLANE_SVG='<svg viewBox="0 0 24 24" aria-hidden="true">'
  +'<path d="M12 1.6c.9 0 1.6 1.3 1.6 2.9v4.2l8.1 4.7v2.3l-8.1-2.4v4.6l2.6 1.9v1.9'
  +'L12 20.9l-4.2 1.2v-1.9l2.6-1.9v-4.6L2.3 15.7v-2.3l8.1-4.7V4.5c0-1.6.7-2.9 1.6-2.9z"/></svg>';

function runSplash(){
  const sp=$('#splash'); if(!sp) return;
  const mk=(cls,size,left,dur,delay,anim)=>{
    const e=document.createElement('span');
    e.className='pl'+(cls?' '+cls:'');
    e.innerHTML=PLANE_SVG;
    e.style.left=left+'vw'; e.style.fontSize=size;
    e.style.animation=`${anim} ${dur}s cubic-bezier(.32,0,.5,1) ${delay}s forwards`;
    sp.appendChild(e);
  };
  /* lop 1: nhieu may bay vua */
  for(let i=0;i<30;i++)
    mk('', (34+Math.random()*52).toFixed(0)+'px', (Math.random()*94).toFixed(1),
       (0.85+Math.random()*0.45).toFixed(2), (0.95+Math.random()*0.4).toFixed(2), 'fly');
  /* lop 2: may bay khong lo phu kin man hinh */
  [8,30,52,74,-4].forEach((lf,i)=>
    mk('big', (26+Math.random()*16).toFixed(0)+'vw', lf,
       (0.95).toFixed(2), (1.3+i*0.07).toFixed(2), 'flybig'));

  setTimeout(()=>$('#sttl').classList.add('go'),1000);
  setTimeout(()=>sp.classList.add('out'),2150);
  setTimeout(()=>{sp.hidden=true},2750);
}
runSplash();
boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
